<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanilla Engine – Editor</title>
<style>
  :root {
    --bg: #171a21;
    --panel: #1d212a;
    --panel-2: #252a36;
    --viewport: #12151b;
    --line: #2d3340;
    --line-soft: #252a35;
    --text: #e4e8ef;
    --text-2: #aab2c0;
    --muted: #7b8495;
    --accent: #f2b134;
    --accent-hover: #f7c25c;
    --accent-ink: #2a1d00;
    --accent-soft: rgba(242, 177, 52, 0.15);
    --axis-x: #ef6b6b;
    --axis-y: #4ed08a;
    --axis-z: #5a9cf5;
    --good: #4ed08a;
    --warn: #f2b134;
    --bad: #ef6b6b;
    --hover: rgba(255, 255, 255, 0.06);
    --scrim: rgba(8, 10, 14, 0.62);
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    --ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  body.light-theme {
    --bg: #e8ebf0;
    --panel: #f5f6f8;
    --panel-2: #ffffff;
    --viewport: #fcfcfd;
    --line: #d2d7e0;
    --line-soft: #e2e5eb;
    --text: #1b2030;
    --text-2: #444c5e;
    --muted: #768093;
    --accent: #b86f00;
    --accent-hover: #a36100;
    --accent-ink: #ffffff;
    --accent-soft: rgba(184, 111, 0, 0.12);
    --axis-x: #d64545;
    --axis-y: #1f9d5b;
    --axis-z: #2f72d6;
    --good: #1f9d5b;
    --warn: #b86f00;
    --bad: #d64545;
    --hover: rgba(20, 30, 50, 0.06);
    --scrim: rgba(230, 233, 240, 0.7);
    --shadow: 0 16px 40px rgba(30, 40, 60, 0.18);
  }

  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .ic.fill { fill: currentColor; stroke: none; }

  /* ───── Toolbar ───── */
  #toolbar {
    flex: none; height: 46px; padding: 0 12px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .mark { color: var(--accent); width: 20px; height: 20px; }
  .brand-name { font-weight: 650; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; }
  .brand-sub { color: var(--muted); font-size: 13px; padding-left: 10px; border-left: 1px solid var(--line); white-space: nowrap; }
  .toolbar-end { display: flex; justify-content: flex-end; gap: 4px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--text-2); font-weight: 550; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover { background: var(--hover); color: var(--text); }
  .btn:active { background: var(--line-soft); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); padding: 0 16px 0 13px; font-weight: 650; }
  .btn-primary:hover { background: var(--accent-hover); color: var(--accent-ink); }
  .btn-primary:active { background: var(--accent); filter: brightness(.94); }
  .icon-btn { width: 28px; height: 28px; padding: 0; justify-content: center; }

  /* ───── Workspace ───── */
  #workspace { flex: 1; min-height: 0; display: flex; }
  #main-column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #canvas-container { flex: 1; min-height: 0; position: relative; background: var(--viewport); overflow: hidden; }
  canvas.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  canvas#screen { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#screen:active { cursor: grabbing; }
  canvas#screen.no-grab, canvas#screen.no-grab:active { cursor: default; }

  #viewfinder-container {
    position: absolute; top: 14px; right: 14px; width: 90px; height: 90px;
    border-radius: 10px; background: color-mix(in srgb, var(--panel) 72%, transparent);
    border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    pointer-events: none; z-index: 5;
  }
  #viewfinder-canvas { width: 100%; height: 100%; display: block; }

  #hint {
    position: absolute; left: 14px; bottom: 14px; z-index: 5; pointer-events: none;
    display: flex; align-items: center; gap: 14px; padding: 6px 12px;
    background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line);
    border-radius: 8px; color: var(--text-2); font-size: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #hint .group { display: flex; align-items: center; gap: 6px; }
  kbd {
    font: 600 11px/1 var(--mono); color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 3px 5px; min-width: 20px; text-align: center;
  }
  .keys { display: flex; gap: 3px; }

  /* ───── Sidebar ───── */
  #sidebar { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  #explorer-pane { flex: 0 0 36%; min-height: 150px; border-bottom: 1px solid var(--line); }
  #properties-pane { flex: 1; }
  .pane-header {
    flex: none; height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 650; color: var(--text); border-bottom: 1px solid var(--line-soft);
  }
  .pane-header .ic { color: var(--muted); }
  .pane-content { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #properties-content { padding: 0; }

  /* Explorer tree */
  .tree-group {
    width: 100%; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 4px;
    background: none; border: 0; border-radius: 5px; color: var(--text); font-weight: 600; text-align: left; cursor: pointer;
  }
  .tree-group:hover { background: var(--hover); }
  .tree-group .chev { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; }
  .tree-group[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .tree-group .kind { color: var(--muted); }
  .tree-children { margin: 0 0 4px 13px; padding-left: 8px; border-left: 1px solid var(--line-soft); }
  .tree-children[hidden] { display: none; }
  .tree-item {
    position: relative; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px;
    border-radius: 5px; color: var(--text-2); cursor: pointer;
  }
  .tree-item .ic { color: var(--muted); }
  .tree-item .tree-id { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
  .tree-item:hover { background: var(--hover); color: var(--text); }
  .tree-item.selected { background: var(--accent-soft); color: var(--text); }
  .tree-item.selected::before { content: ""; position: absolute; left: -9px; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--accent); }
  .tree-item.selected .ic { color: var(--accent); }
  .tree-empty { height: 26px; padding: 0 8px; display: flex; align-items: center; color: var(--muted); font-style: italic; }

  /* Properties */
  .obj-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  .obj-head .ic { width: 20px; height: 20px; color: var(--accent); }
  .obj-name { font-weight: 650; line-height: 1.2; }
  .obj-meta { min-width: 0; }
  .obj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obj-id { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--muted); }
  .obj-id .uid { color: var(--text-2); user-select: all; -webkit-user-select: all; cursor: text; }
  .obj-id .uid::before { content: "·"; margin-right: 6px; color: var(--muted); }
  input.text {
    width: 100%; height: 30px; padding: 0 9px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font: 13px var(--ui); transition: border-color .15s, box-shadow .15s;
  }
  input.text:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--muted)); }
  input.text:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input.text:disabled { color: var(--muted); background: transparent; border-style: dashed; cursor: not-allowed; }
  .switch-stack { margin-top: 8px; }
  .chip { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 600; }
  .chip .ic { width: 12px; height: 12px; }

  details.sec { border-bottom: 1px solid var(--line-soft); }
  details.sec > summary {
    list-style: none; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px;
    font-weight: 600; color: var(--text); cursor: pointer;
  }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary:hover { background: var(--hover); }
  details.sec > summary .chev { width: 14px; height: 14px; color: var(--muted); transition: transform .15s; }
  details.sec[open] > summary .chev { transform: rotate(90deg); }
  .sec-body { padding: 4px 14px 14px; }
  .field-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .num {
    display: flex; align-items: center; height: 30px; min-width: 0;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; transition: border-color .15s, box-shadow .15s;
  }
  .num:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--muted)); }
  .num:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .num .tag { flex: none; width: 24px; text-align: center; font: 700 11px var(--mono); }
  .tag.x { color: var(--axis-x); } .tag.y { color: var(--axis-y); } .tag.z { color: var(--axis-z); }
  .num input {
    flex: 1; min-width: 0; height: 100%; padding: 0 6px 0 0; background: transparent; border: 0; outline: none;
    color: var(--text); font: 12px var(--mono); -moz-appearance: textfield;
  }
  .num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .num input:disabled { color: var(--muted); cursor: not-allowed; }
  .num:has(input:disabled) { background: transparent; border-style: dashed; }
  .field-label { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
  .field-label:not(:first-child) { margin-top: 12px; }

  label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; cursor: pointer; color: var(--text-2); }
  label.row:hover { color: var(--text); }
  label.row.is-disabled { opacity: .45; cursor: not-allowed; }
  input.switch {
    appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 30px; height: 18px; margin: 0; cursor: inherit;
    border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); transition: background .15s, border-color .15s;
  }
  input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
  input.switch:checked { background: var(--accent); border-color: var(--accent); }
  input.switch:checked::after { transform: translateX(12px); background: var(--accent-ink); }

  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 36px 24px; color: var(--muted); }
  .empty .ic { width: 22px; height: 22px; margin-bottom: 6px; }
  .empty p { margin: 0; color: var(--text); font-weight: 600; }
  .empty span { max-width: 210px; }

  /* ───── Status bar ───── */
  #statusbar {
    flex: none; height: 28px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--panel); border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--text-2);
  }
  .stats { display: flex; align-items: center; gap: 20px; min-width: 0; overflow: hidden; }
  .stat { display: inline-flex; gap: 6px; white-space: nowrap; }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  #stat-fps::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; vertical-align: 1px; background: var(--good); }
  #stat-fps[data-state="warn"]::before { background: var(--warn); }
  #stat-fps[data-state="bad"]::before { background: var(--bad); }
  #status-version { color: var(--muted); }

  /* ───── Modals ───── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: min(380px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    transform: translateY(6px); transition: transform .18s ease;
  }
  .modal-overlay.active .modal-card { transform: none; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--line-soft); }
  .modal-title { margin: 0; font-size: 15px; font-weight: 650; }
  .modal-body { padding: 6px 18px 18px; }
  .info-row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
  .info-row:last-child { border-bottom: 0; }
  .info-row dt { color: var(--muted); }
  .info-row dd { margin: 0; font: 600 13px var(--mono); }
  dl { margin: 0; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 0; cursor: pointer; }
  .setting + .setting { border-top: 1px solid var(--line-soft); }
  .setting-title { font-weight: 600; }
  .setting-desc { color: var(--muted); font-size: 12px; margin-top: 2px; }


  /* ───── Mode palette ───── */
  #tools {
    position: absolute; top: 14px; left: 14px; z-index: 6; display: flex; flex-direction: column; gap: 2px; padding: 4px;
    background: color-mix(in srgb, var(--panel) 80%, transparent); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .tool {
    position: relative; width: 34px; height: 34px; display: grid; place-items: center; padding: 0;
    background: transparent; border: 0; border-radius: 7px; color: var(--text-2); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tool .ic { width: 18px; height: 18px; }
  .tool:hover { background: var(--hover); color: var(--text); }
  .tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .tool-key { position: absolute; right: 4px; bottom: 2px; font: 600 9px var(--mono); color: var(--muted); }
  .tool[aria-pressed="true"] .tool-key { color: var(--accent); }

  /* ───── Explorer add buttons & creator menu ───── */
  .tree-row { display: flex; align-items: center; gap: 2px; }
  .tree-row .tree-group { width: auto; flex: 1; min-width: 0; }
  .add-btn {
    flex: none; width: 26px; height: 26px; display: grid; place-items: center; padding: 0;
    background: transparent; border: 0; border-radius: 5px; color: var(--muted); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .add-btn:hover { background: var(--hover); color: var(--accent); }
  .menu {
    position: fixed; z-index: 90; width: 232px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  }
  .menu[hidden] { display: none; }
  .menu-title { padding: 6px 10px 4px; color: var(--muted); font-size: 12px; }
  .menu-item {
    width: 100%; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px;
    background: transparent; border: 0; border-radius: 6px; color: var(--text); text-align: left; cursor: pointer;
  }
  .menu-item .ic { color: var(--muted); }
  .menu-item:hover, .menu-item:focus-visible { background: var(--accent-soft); outline: none; }
  .menu-item:hover .ic, .menu-item:focus-visible .ic { color: var(--accent); }
  .menu-meta { margin-left: auto; font: 11px var(--mono); color: var(--muted); }

  /* ───── Time of day ───── */
  .tod-row { display: flex; align-items: center; gap: 10px; }
  input.tod {
    appearance: none; -webkit-appearance: none; flex: 1; min-width: 0; height: 12px; margin: 0; padding: 0;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--panel-2);
  }
  input.tod::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    border: 3px solid var(--accent); box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45);
  }
  input.tod::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
  input.time {
    flex: none; width: 96px; height: 30px; padding: 0 8px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font: 12px var(--mono); color-scheme: dark;
  }
  body.light-theme input.time { color-scheme: light; }
  input.time:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pill-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .pill {
    height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text-2); font-size: 12px; font-weight: 550; cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  }
  .pill:hover { color: var(--text); border-color: var(--muted); }
  .pill[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  /* ───── Explorer item actions ───── */
  .tree-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-item .item-more {
    display: none; margin-left: auto; flex: none; width: 22px; height: 22px; padding: 0; place-items: center;
    background: transparent; border: 0; border-radius: 5px; color: var(--text-2); cursor: pointer;
  }
  .tree-item .item-more .ic { color: inherit; stroke-width: 2.4; }
  .tree-item .item-more:hover { background: var(--hover); color: var(--text); }
  .tree-item:hover .item-more, .tree-item:focus-within .item-more, .tree-item.menu-open .item-more { display: grid; }
  .tree-item:hover .tree-id, .tree-item:focus-within .tree-id, .tree-item.menu-open .tree-id { display: none; }
  .tree-item.menu-open { background: var(--hover); color: var(--text); }
  input.rename-input {
    flex: 1; min-width: 0; height: 22px; padding: 0 6px; margin: 0 -2px; background: var(--panel-2);
    border: 1px solid var(--accent); border-radius: 4px; color: var(--text); font: 13px var(--ui); outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #item-menu { width: 196px; }
  .menu-item:disabled { opacity: .4; cursor: not-allowed; }
  .menu-item:disabled:hover { background: transparent; }
  .menu-item:disabled:hover .ic { color: var(--muted); }
  .menu-item.danger:not(:disabled):hover, .menu-item.danger:not(:disabled):focus-visible { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .menu-item.danger:not(:disabled):hover .ic, .menu-item.danger:not(:disabled):focus-visible .ic { color: var(--bad); }

  /* ───── Offset (gizmo increment) ───── */
  .run-group { display: flex; align-items: center; gap: 10px; }
  .offset-field {
    flex: none; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 4px 0 10px; cursor: text;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text-2); font-weight: 550;
    transition: border-color .15s, box-shadow .15s, color .15s;
  }
  .offset-field .ic { color: var(--muted); transition: color .15s; }
  .offset-field:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--muted)); color: var(--text); }
  .offset-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); color: var(--text); }
  .offset-field:focus-within .ic { color: var(--accent); }
  .offset-field input {
    width: 48px; height: 100%; padding: 0 6px; background: transparent; border: 0; outline: none; text-align: right;
    color: var(--text); font: 12px var(--mono); -moz-appearance: textfield;
  }
  .offset-field input::-webkit-inner-spin-button, .offset-field input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* ───── Simulation ───── */
  select.text {
    width: 100%; height: 30px; padding: 0 9px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font: 13px var(--ui); cursor: pointer; color-scheme: dark; transition: border-color .15s, box-shadow .15s;
  }
  body.light-theme select.text { color-scheme: light; }
  select.text:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--muted)); }
  select.text:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .num.grav { flex: none; width: 112px; }
  .num.grav input { padding-left: 8px; }
  .num.grav .tag { width: auto; padding: 0 8px 0 0; color: var(--muted); font: 11px var(--mono); }
  .field-note { margin-top: 6px; color: var(--muted); font-size: 12px; }
  #canvas-container.simulating::after {
    content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  #sim-badge {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; display: none; align-items: center; gap: 7px;
    height: 26px; padding: 0 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 650; pointer-events: none;
  }
  #sim-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: simpulse 1.2s ease-in-out infinite; }
  #canvas-container.simulating #sim-badge { display: inline-flex; }
  @keyframes simpulse { 50% { opacity: .3; } }

  /* ───── Narrow screens ───── */
  @media (max-width: 760px) {
    #workspace { flex-direction: column; }
    #sidebar { width: 100%; height: 42%; flex-direction: row; border-left: 0; border-top: 1px solid var(--line); }
    #sidebar .pane { flex: 1 1 50%; min-height: 0; }
    #explorer-pane { border-bottom: 0; border-right: 1px solid var(--line); }
    #hint, .brand-sub, .btn .label, .offset-label { display: none; }
    .stats { gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <script>
        const ENGINE_VERSION = '1.8.1.3';
        const icon = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

        // ───────── Scene data ─────────
        const spaces = {
            world:   { name: 'World',   icon: 'i-world',  addable: true },
            storage: { name: 'Storage', icon: 'i-folder', addable: true },
            scripts: { name: 'Scripts', icon: 'i-script', addable: true },
            engine:  { name: 'Engine',  icon: 'i-engine', addable: false }
        };
        function makePrism(name, parent, dims) {
            return Object.assign({
                type: 'prism6', name, parent,
                x: 0, y: 0, z: 0, length: 1, width: 1, height: 1,
                faceColoring: false, showLabels: false, wireframe: false, locked: false, reactsToPhysics: false, collidable: true, anchored: false
            }, dims);
        }
        // Every instance has a type (its label, e.g. "prism6", shared by all of that kind)
        // and a unique id (Word + 3 digits, e.g. "Cobalt092") the engine uses to tell instances apart.
        const ID_WORDS = ['Cobalt', 'Amber', 'Falcon', 'Ember', 'Quartz', 'Willow', 'Zephyr', 'Onyx', 'Meadow', 'Raven', 'Indigo', 'Saffron',
            'Juniper', 'Cinder', 'Marble', 'Tundra', 'Lotus', 'Harbor', 'Velvet', 'Granite', 'Coral', 'Sparrow', 'Maple', 'Topaz', 'Aurora',
            'Basalt', 'Cedar', 'Dune', 'Fjord', 'Glacier', 'Horizon', 'Ivory', 'Lagoon', 'Mistral', 'Nimbus', 'Orchid', 'Pebble', 'Quill', 'Rowan', 'Summit'];
        function newId() {
            let id;
            do { id = ID_WORDS[Math.floor(Math.random() * ID_WORDS.length)] + String(Math.floor(Math.random() * 1000)).padStart(3, '0'); }
            while (sceneObjects[id]);
            return id;
        }
        const esc = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        const sceneObjects = {
            'Cobalt092': makePrism('Block', 'world', { length: 1.8, width: 1.0, height: 0.8 }),
            'Onyx004': { type: 'viewfinder', name: 'Viewfinder', parent: 'engine', readOnly: true }
        };
        sceneObjects['Amber417'] = { type: 'worldsettings', name: 'Settings', parent: 'world', timeOfDay: 14, gravity: 9.8, killY: -5000 };
        const counters = { prism: 1, script: 0, worldsettings: 1 };
        const typeIcon = { prism6: 'i-cube', script: 'i-script', viewfinder: 'i-lock', worldsettings: 'i-sun' };

        let isLightMode = false;
        let accentCol = '#f2b134';
        let selectedObjectId = null;
        let mode = 'select';

        // Rigid-body simulation for World prisms.
        // Run works like Roblox Studio: the world is snapshotted, everything runs live, and Stop restores the snapshot.
        let simulationRunning = false;
        let simSnapshot = null;
        let physicsLastTime = 0;
        const physicsVelocity = new Map();
        const PHYSICS_MAX_STEP = 1 / 120;
        const DEFAULT_GRAVITY = 9.8;          // meters per second squared (Earth)
        const GRAVITY_MAX = 1000;
        const GRAVITY_PRESETS = [['Earth', 9.8], ['Moon', 1.62], ['Space', 0], ['Jupiter', 24.8]];
        const DEFAULT_KILL_Y = -5000;

        // Simulation properties live on the World Settings instance.
        function activeWorldSettings() {
            for (const o of Object.values(sceneObjects)) if (o.type === 'worldsettings' && o.parent === 'world') return o;
            return null;
        }
        function currentGravity() {
            const ws = activeWorldSettings();
            return -(ws && Number.isFinite(ws.gravity) ? ws.gravity : DEFAULT_GRAVITY);
        }
        function currentKillY() {
            const ws = activeWorldSettings();
            return ws && Number.isFinite(ws.killY) ? ws.killY : DEFAULT_KILL_Y;
        }

        function physicsBodyList() {
            return Object.entries(sceneObjects)
                .filter(([, o]) => o.type === 'prism6' && o.parent === 'world');
        }

        function physicsVelocityFor(id) {
            if (!physicsVelocity.has(id)) physicsVelocity.set(id, { x: 0, y: 0, z: 0 });
            return physicsVelocity.get(id);
        }

        // A body moves under physics only when it reacts to physics and is not anchored.
        const isMovable = (o) => o.reactsToPhysics && !o.anchored;

        function resolvePhysicsCollisions(bodies) {
            // Every collidable prism blocks movers. There is no ground plane: things fall until they land on something.
            const colliders = bodies.filter(([, o]) => o.collidable !== false);

            // Resolve each pair once. Fixed bodies (anchored or not reacting) never move but still block movers.
            for (let i = 0; i < colliders.length; i++) {
                const [idA, a] = colliders[i];
                for (let j = i + 1; j < colliders.length; j++) {
                    const [idB, b] = colliders[j];
                    const aMoves = isMovable(a);
                    const bMoves = isMovable(b);
                    if (!aMoves && !bMoves) continue;

                    const dx = (a.width + b.width) - Math.abs(a.x - b.x);
                    const dy = (a.height + b.height) - Math.abs(a.y - b.y);
                    const dz = (a.length + b.length) - Math.abs(a.z - b.z);
                    if (dx <= 0 || dy <= 0 || dz <= 0) continue;

                    const signX = a.x < b.x ? -1 : 1;
                    const signY = a.y < b.y ? -1 : 1;
                    const signZ = a.z < b.z ? -1 : 1;
                    const av = physicsVelocityFor(idA);
                    const bv = physicsVelocityFor(idB);
                    const shareA = aMoves && bMoves ? 0.5 : (aMoves ? 1 : 0);
                    const shareB = aMoves && bMoves ? 0.5 : (bMoves ? 1 : 0);

                    if (dy <= dx && dy <= dz) {
                        a.y += signY * dy * shareA;
                        b.y -= signY * dy * shareB;
                        if (av.y * signY < 0) av.y = 0;
                        if (bv.y * signY > 0) bv.y = 0;
                    } else if (dx <= dz) {
                        a.x += signX * dx * shareA;
                        b.x -= signX * dx * shareB;
                        if (av.x * signX < 0) av.x = 0;
                        if (bv.x * signX > 0) bv.x = 0;
                    } else {
                        a.z += signZ * dz * shareA;
                        b.z -= signZ * dz * shareB;
                        if (av.z * signZ < 0) av.z = 0;
                        if (bv.z * signZ > 0) bv.z = 0;
                    }
                }
            }
        }

        function physicsStep(dt) {
            if (!simulationRunning) return;
            const g = currentGravity(), killY = currentKillY();
            const bodies = physicsBodyList();

            // Long falls get fast, so split the step to keep a body from skipping through thin objects.
            let maxSpeed = 0;
            for (const [id, o] of bodies) {
                if (!isMovable(o)) continue;
                const v = physicsVelocityFor(id);
                maxSpeed = Math.max(maxSpeed, Math.abs(v.x), Math.abs(v.y) + Math.abs(g) * dt, Math.abs(v.z));
            }
            const subSteps = Math.max(1, Math.min(64, Math.ceil(maxSpeed * dt / 0.1)));
            const h = dt / subSteps;
            for (let s = 0; s < subSteps; s++) {
                for (const [id, o] of bodies) {
                    if (!isMovable(o)) continue;
                    const v = physicsVelocityFor(id);
                    v.y += g * h;
                    o.x += v.x * h;
                    o.y += v.y * h;
                    o.z += v.z * h;
                }
                // A few passes help stacked boxes settle without obvious overlap.
                for (let pass = 0; pass < 3; pass++) resolvePhysicsCollisions(bodies);
            }

            // Kill layer: anything that falls below it is deleted from the world.
            let removed = false;
            for (const [id, o] of bodies) {
                if (isMovable(o) && o.y < killY) {
                    delete sceneObjects[id];
                    physicsVelocity.delete(id);
                    if (selectedObjectId === id) selectedObjectId = null;
                    removed = true;
                }
            }
            if (removed) { renderExplorer(); renderProperties(); }
        }

        function takeSnapshot() {
            simSnapshot = { objects: JSON.parse(JSON.stringify(sceneObjects)), counters: Object.assign({}, counters) };
        }
        function restoreSnapshot() {
            if (!simSnapshot) return;
            for (const k of Object.keys(sceneObjects)) delete sceneObjects[k];
            Object.assign(sceneObjects, JSON.parse(JSON.stringify(simSnapshot.objects)));
            Object.assign(counters, simSnapshot.counters);
            simSnapshot = null;
            physicsVelocity.clear();
            manip = null;
            if (selectedObjectId && !sceneObjects[selectedObjectId]) selectedObjectId = null;
            renderExplorer();
            renderProperties();
        }

        function setSimulationRunning(running) {
            if (running === simulationRunning) return;
            physicsLastTime = 0;
            physicsVelocity.clear();
            if (running) {
                takeSnapshot();
                simulationRunning = true;
            } else {
                simulationRunning = false;
                restoreSnapshot();
            }
            const btn = document.getElementById('run-btn');
            btn.innerHTML = running
                ? `<span aria-hidden="true" style="font-size:14px;line-height:1">■</span><span class="label">Stop</span>`
                : `${icon('i-play')}<span class="label">Run</span>`;
            btn.title = running ? 'Stop and restore the world to how it was before Run.' : 'Run the simulation.';
            btn.setAttribute('aria-pressed', String(running));
            document.getElementById('canvas-container').classList.toggle('simulating', running);
        }
        document.getElementById('run-btn').addEventListener('click', () => setSimulationRunning(!simulationRunning));

        let accentRGB = [0.95, 0.69, 0.2];
        function refreshTheme() {
            accentCol = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#f2b134';
            if (/^#[0-9a-f]{6}$/i.test(accentCol)) accentRGB = [1, 3, 5].map(i => parseInt(accentCol.slice(i, i + 2), 16) / 255);
        }

        function addInstance(kind, space) {
            const id = newId();
            let obj;
            if (kind === 'prism6') {
                const n = ++counters.prism;
                const k = n - 2;
                const offset = (k % 2 === 0 ? 1 : -1) * 3 * (Math.floor(k / 2) + 1);
                obj = makePrism('Block ' + n, space, { x: offset, length: 0.75, width: 0.75, height: 0.75 });
            } else if (kind === 'worldsettings') {
                const n = ++counters.worldsettings;
                obj = { type: 'worldsettings', name: 'Settings ' + n, parent: space, timeOfDay: 14, gravity: 9.8, killY: -5000 };
            } else {
                const n = ++counters.script;
                obj = { type: 'script', name: n === 1 ? 'Script' : 'Script ' + n, parent: space };
            }
            sceneObjects[id] = obj;
            collapsed.delete(space);
            selectItem(id);
        }

        // ───────── Canvas & UI elements ─────────
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const skyCanvas = document.getElementById('sky-canvas');
        const skyCtx = skyCanvas.getContext('2d');
        const glCanvas = document.getElementById('gl-canvas');
        const vfCanvas = document.getElementById('viewfinder-canvas');
        const vfCtx = vfCanvas.getContext('2d');

        const statFps = document.getElementById('stat-fps');
        const statCpu = document.getElementById('stat-cpu');
        const statMem = document.getElementById('stat-mem');
        const statVerts = document.getElementById('stat-verts');
        const statFaces = document.getElementById('stat-faces');

        // Camera control settings (saved in this browser)
        const settings = { leftDrag: true, rightClick: false, gizmoOffset: 0.5 };
        try { Object.assign(settings, JSON.parse(localStorage.getItem('vanilla-editor-settings') || '{}')); } catch (e) {}
        function applySettings() {
            document.getElementById('opt-left-drag').checked = settings.leftDrag;
            document.getElementById('opt-right-click').checked = settings.rightClick;
            canvas.classList.toggle('no-grab', !settings.leftDrag);
            const look = document.getElementById('hint-look');
            look.hidden = !settings.leftDrag && !settings.rightClick;
            look.querySelector('kbd').textContent = settings.leftDrag && settings.rightClick ? 'Drag / Right-drag' : settings.rightClick ? 'Right-drag' : 'Drag';
        }
        function saveSettings() {
            applySettings();
            try { localStorage.setItem('vanilla-editor-settings', JSON.stringify(settings)); } catch (e) {}
        }
        document.getElementById('opt-left-drag').addEventListener('change', (e) => { settings.leftDrag = e.target.checked; saveSettings(); });
        document.getElementById('opt-right-click').addEventListener('change', (e) => { settings.rightClick = e.target.checked; saveSettings(); });

        // Offset: the step the Move and Scale gizmos snap to (Vanillameters). 0 means free movement.
        const offsetEl = document.getElementById('offset-input');
        const parseOffset = (v) => { const n = parseFloat(v); return Number.isFinite(n) && n >= 0 ? n : null; };
        if (parseOffset(settings.gizmoOffset) === null) settings.gizmoOffset = 0.5;
        offsetEl.value = settings.gizmoOffset;
        const persistOffset = () => { try { localStorage.setItem('vanilla-editor-settings', JSON.stringify(settings)); } catch (e) {} };
        offsetEl.addEventListener('input', () => { const n = parseOffset(offsetEl.value); if (n !== null) { settings.gizmoOffset = n; persistOffset(); } });
        offsetEl.addEventListener('change', () => { offsetEl.value = settings.gizmoOffset; });
        offsetEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') offsetEl.blur(); });

        // Theme toggle
        document.getElementById('theme-toggle').addEventListener('change', (e) => {
            isLightMode = e.target.checked;
            document.body.classList.toggle('light-theme', isLightMode);
            refreshTheme();
        });

        // Modals
        let lastFocus = null;
        function openModal(id, focusSel) {
            lastFocus = document.activeElement;
            const m = document.getElementById(id);
            m.classList.add('active');
            (m.querySelector(focusSel) || m.querySelector('[data-close]')).focus();
        }
        function closeModals() {
            const open = document.querySelector('.modal-overlay.active');
            if (!open) return;
            open.classList.remove('active');
            if (lastFocus) lastFocus.focus();
        }
        document.getElementById('version-btn').addEventListener('click', () => {
            document.getElementById('info-version').textContent = ENGINE_VERSION;
            openModal('modal-version');
        });
        document.getElementById('settings-btn').addEventListener('click', () => openModal('modal-settings', '#theme-toggle'));
        document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModals));
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('mousedown', (e) => { if (e.target === m) closeModals(); }));
        document.getElementById('status-version').textContent = 'v' + ENGINE_VERSION;

        // ───────── Explorer ─────────
        const explorerEl = document.getElementById('explorer-content');
        const collapsed = new Set();
        let renamingId = null, menuItemId = null;

        function renderExplorer() {
            explorerEl.innerHTML = Object.entries(spaces).map(([sid, sp]) => {
                const kids = Object.entries(sceneObjects).filter(([, o]) => o.parent === sid);
                const open = !collapsed.has(sid);
                const rows = kids.length ? kids.map(([id, o]) => `
                    <div class="tree-item${id === selectedObjectId ? ' selected' : ''}${id === menuItemId ? ' menu-open' : ''}" role="treeitem" tabindex="0" data-id="${id}">
                        ${icon(typeIcon[o.type])}${id === renamingId
                            ? `<input class="rename-input" type="text" maxlength="48" value="${esc(o.name)}" aria-label="Rename">`
                            : `<span class="tree-name">${esc(o.name)}</span>`}${o.type === 'viewfinder' ? '' : `<span class="tree-id">${o.type}</span>`}${o.readOnly ? ''
                            : `<button class="item-more" data-more="${id}" aria-label="More options for ${esc(o.name)}" aria-haspopup="menu" title="More options">${icon('i-more')}</button>`}
                    </div>`).join('')
                    : `<div class="tree-empty">${sid === 'scripts' ? 'No scripts yet' : 'Empty'}</div>`;
                return `
                    <div class="tree-space">
                        <div class="tree-row">
                            <button class="tree-group" data-space="${sid}" aria-expanded="${open}">${icon('i-chev', 'chev')}${icon(sp.icon, 'kind')}${sp.name}</button>
                            ${sp.addable ? `<button class="add-btn" data-add="${sid}" aria-label="Add to ${sp.name}" title="Add to ${sp.name}">${icon('i-plus')}</button>` : ''}
                        </div>
                        <div class="tree-children"${open ? '' : ' hidden'}>${rows}</div>
                    </div>`;
            }).join('');
            const ri = explorerEl.querySelector('.rename-input');
            if (ri) { ri.focus(); ri.select(); }
        }

        explorerEl.addEventListener('click', (e) => {
            if (e.target.closest('.rename-input')) return;
            const more = e.target.closest('.item-more');
            if (more) {
                const id = more.dataset.more;
                (!itemMenu.hidden && menuItemId === id) ? closeItemMenu(true) : openItemMenu(id, more.getBoundingClientRect(), false);
                return;
            }
            const add = e.target.closest('[data-add]');
            if (add) { (!addMenu.hidden && menuBtn === add) ? closeAddMenu(true) : openAddMenu(add); return; }
            const grp = e.target.closest('.tree-group');
            if (grp) {
                const sid = grp.dataset.space;
                collapsed.has(sid) ? collapsed.delete(sid) : collapsed.add(sid);
                renderExplorer();
                const again = explorerEl.querySelector(`.tree-group[data-space="${sid}"]`);
                if (again) again.focus();
                return;
            }
            const item = e.target.closest('.tree-item');
            if (item) selectItem(item.dataset.id);
        });
        explorerEl.addEventListener('keydown', (e) => {
            if (e.target.closest('.rename-input')) {
                if (e.key === 'Enter') { e.preventDefault(); commitRename(true); }
                else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); commitRename(false); }
                return;
            }
            if (e.target.closest('.item-more')) return;
            const item = e.target.closest('.tree-item');
            if (item && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                selectItem(item.dataset.id);
                const again = explorerEl.querySelector(`.tree-item[data-id="${item.dataset.id}"]`);
                if (again) again.focus();
            }
        });

        // ───────── Instance creator menu ─────────
        const addMenu = document.getElementById('add-menu');
        let menuBtn = null;
        function openAddMenu(btn) {
            if (typeof itemMenu !== 'undefined' && !itemMenu.hidden) closeItemMenu(false);
            menuBtn = btn;
            addMenu.dataset.space = btn.dataset.add;
            document.getElementById('add-menu-title').textContent = 'Add to ' + spaces[btn.dataset.add].name;
            addMenu.hidden = false;
            const r = btn.getBoundingClientRect();
            const mw = addMenu.offsetWidth, mh = addMenu.offsetHeight;
            const left = Math.min(Math.max(8, r.right - mw), window.innerWidth - mw - 8);
            let top = r.bottom + 4;
            if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
            addMenu.style.left = left + 'px';
            addMenu.style.top = top + 'px';
            addMenu.querySelector('.menu-item').focus();
        }
        function closeAddMenu(restoreFocus) {
            if (addMenu.hidden) return;
            addMenu.hidden = true;
            if (restoreFocus && menuBtn && document.contains(menuBtn)) menuBtn.focus();
        }
        addMenu.addEventListener('click', (e) => {
            const it = e.target.closest('.menu-item');
            if (!it) return;
            const space = addMenu.dataset.space;
            closeAddMenu(false);
            addInstance(it.dataset.kind, space);
        });
        addMenu.addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            e.preventDefault();
            const items = [...addMenu.querySelectorAll('.menu-item')];
            const i = items.indexOf(document.activeElement);
            items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
        });
        document.addEventListener('mousedown', (e) => {
            if (!addMenu.hidden && !addMenu.contains(e.target) && !e.target.closest('.add-btn')) closeAddMenu(false);
        });

        // ───────── Explorer item context menu ─────────
        const itemMenu = document.getElementById('item-menu');
        let clipboard = null;   // { data, cut, pastes }
        const cloneData = (o) => JSON.parse(JSON.stringify(o));

        function placeMenu(menu, rect, alignLeft) {
            const mw = menu.offsetWidth, mh = menu.offsetHeight;
            let left = alignLeft ? rect.left : rect.right - mw;
            left = Math.min(Math.max(8, left), window.innerWidth - mw - 8);
            let top = rect.bottom + 4;
            if (top + mh > window.innerHeight - 8) top = Math.max(8, rect.top - mh - 4);
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
        }
        function openItemMenu(id, rect, alignLeft) {
            const o = sceneObjects[id];
            if (!o || o.readOnly) return;
            closeAddMenu(false);
            menuItemId = id;
            itemMenu.dataset.id = id;
            const off = (act, v) => { itemMenu.querySelector(`[data-act="${act}"]`).disabled = v; };
            off('rename', !!o.locked);
            off('cut', !!o.locked);
            off('delete', !!o.locked);
            off('paste', !clipboard);
            off('camera', !(o.type === 'prism6' && o.parent === 'world'));
            itemMenu.hidden = false;
            renderExplorer();
            placeMenu(itemMenu, rect, alignLeft);
            const first = itemMenu.querySelector('.menu-item:not(:disabled)');
            if (first) first.focus();
        }
        function closeItemMenu(restoreFocus) {
            if (itemMenu.hidden) return;
            itemMenu.hidden = true;
            const id = menuItemId;
            menuItemId = null;
            renderExplorer();
            if (restoreFocus) {
                const btn = explorerEl.querySelector(`[data-more="${id}"]`);
                if (btn) btn.focus();
            }
        }
        itemMenu.addEventListener('click', (e) => {
            const it = e.target.closest('.menu-item');
            if (!it || it.disabled) return;
            const id = itemMenu.dataset.id;
            closeItemMenu(false);
            runItemAction(it.dataset.act, id);
        });
        itemMenu.addEventListener('keydown', (e) => {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            e.preventDefault();
            const items = [...itemMenu.querySelectorAll('.menu-item:not(:disabled)')];
            if (!items.length) return;
            const i = items.indexOf(document.activeElement);
            items[(i + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length].focus();
        });
        document.addEventListener('mousedown', (e) => {
            if (!itemMenu.hidden && !itemMenu.contains(e.target) && !e.target.closest('.item-more')) closeItemMenu(false);
        });
        explorerEl.addEventListener('contextmenu', (e) => {
            const item = e.target.closest('.tree-item');
            if (!item || e.target.closest('.rename-input')) return;
            const o = sceneObjects[item.dataset.id];
            if (!o || o.readOnly) return;
            e.preventDefault();
            openItemMenu(item.dataset.id, { left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY - 4 }, true);
        });
        explorerEl.addEventListener('focusout', (e) => {
            if (e.target.classList && e.target.classList.contains('rename-input')) commitRename(true);
        });

        function commitRename(commit) {
            if (!renamingId) return;
            const id = renamingId;
            renamingId = null;
            const o = sceneObjects[id];
            const inp = explorerEl.querySelector('.rename-input');
            if (o && commit && inp) o.name = inp.value.trim() || defaultNames[o.type] || 'Instance';
            renderExplorer();
            if (id === selectedObjectId) renderProperties();
        }
        function deleteItem(id) {
            delete sceneObjects[id];
            physicsVelocity.delete(id);
            if (renamingId === id) renamingId = null;
            if (selectedObjectId === id) selectedObjectId = null;
            renderExplorer();
            renderProperties();
        }
        function pasteInto(space) {
            const c = clipboard;
            if (!c) return;
            const data = cloneData(c.data);
            data.parent = space;
            if (!c.cut && data.type === 'prism6') {
                // Copies land beside the original; cut-and-paste keeps the exact position.
                c.pastes++;
                data.x = Math.round((data.x + c.pastes * (2 * data.width + 0.5)) * 100) / 100;
            }
            const id = newId();
            sceneObjects[id] = data;
            if (c.cut) clipboard = null;
            collapsed.delete(space);
            selectItem(id);
        }
        function moveCameraTo(id) {
            const o = sceneObjects[id];
            if (!o) return;
            updateTrig();
            const d = Math.hypot(o.width, o.height, o.length) * 2.5 + 2;
            camPosX = o.x - fwdX * d;
            camPosY = o.y - fwdY * d;
            camPosZ = o.z - fwdZ * d;
            selectItem(id);
        }
        function runItemAction(act, id) {
            const o = sceneObjects[id];
            if (!o) return;
            if (act === 'rename') { renamingId = id; renderExplorer(); }
            else if (act === 'copy') clipboard = { data: cloneData(o), cut: false, pastes: 0 };
            else if (act === 'cut') { clipboard = { data: cloneData(o), cut: true, pastes: 0 }; deleteItem(id); }
            else if (act === 'paste') pasteInto(o.parent);
            else if (act === 'delete') deleteItem(id);
            else if (act === 'camera') moveCameraTo(id);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!itemMenu.hidden) { closeItemMenu(true); return; }
            if (!addMenu.hidden) closeAddMenu(true);
            closeModals();
        });

        // ───────── Selection & properties ─────────
        function selectItem(id) {
            selectedObjectId = id || null;
            renderExplorer();
            renderProperties();
        }
        window.selectItem = selectItem;

        const objHead = (id, o, ic, extra = '') =>
            `<div class="obj-head">${icon(ic)}<div class="obj-meta"><div class="obj-name">${esc(o.name)}</div>
                <div class="obj-id"><span title="Instance type">${o.type}</span><span class="uid" title="Unique ID">${id}</span></div></div>${extra}</div>`;
        const defaultNames = { prism6: 'Block', script: 'Script', worldsettings: 'Settings' };
        const nameField = (o, dis = '') =>
            `<div class="field-label">Name</div><input class="text" type="text" id="prop-name" maxlength="48" value="${esc(o.name)}" aria-label="Name" ${dis}>`;
        function bindName(obj) {
            const nameEl = document.getElementById('prop-name');
            if (!nameEl || nameEl.disabled) return;
            const refresh = () => {
                const head = document.querySelector('#properties-content .obj-name');
                if (head) head.textContent = obj.name;
                renderExplorer();
            };
            nameEl.addEventListener('input', () => { obj.name = nameEl.value; refresh(); });
            nameEl.addEventListener('change', () => {
                obj.name = nameEl.value.trim() || defaultNames[obj.type] || 'Instance';
                nameEl.value = obj.name;
                refresh();
            });
            nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameEl.blur(); });
        }
        const numField = (id, tag, axis, title, value, dis) =>
            `<label class="num" title="${title}"><span class="tag ${axis}">${tag}</span><input type="number" id="${id}" step="0.1" value="${value}" aria-label="${title}" ${dis}></label>`;
        const switchRow = (id, label, checked, dis) =>
            `<label class="row${dis ? ' is-disabled' : ''}"><span>${label}</span><input class="switch" type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${dis}></label>`;
        const section = (title, body) =>
            `<details class="sec" open><summary>${icon('i-chev', 'chev')}${title}</summary><div class="sec-body">${body}</div></details>`;

        const propFields = [['prop-x', 'x'], ['prop-y', 'y'], ['prop-z', 'z'], ['prop-length', 'length'], ['prop-width', 'width'], ['prop-height', 'height']];
        function syncPropInputs() {
            const o = sceneObjects[selectedObjectId];
            if (!o || o.type !== 'prism6') return;
            for (const [elId, key] of propFields) {
                const el = document.getElementById(elId);
                if (el && document.activeElement !== el) el.value = o[key];
            }
        }

        function renderProperties() {
            const container = document.getElementById('properties-content');
            if (!selectedObjectId) {
                container.innerHTML = `<div class="empty">${icon('i-pointer')}<p>Nothing selected</p><span>Pick an item in the explorer or click one in the viewport.</span></div>`;
                return;
            }
            const obj = sceneObjects[selectedObjectId];

            if (obj.readOnly) {
                container.innerHTML = `<div class="empty">${icon('i-lock')}<p>${esc(obj.name)}</p><span>This is an engine component and can’t be edited.</span></div>`;
                return;
            }

            if (obj.type === 'worldsettings') {
                const presets = [['Dawn', 6], ['Noon', 12], ['Dusk', 18], ['Night', 0]];
                container.innerHTML = `
                    ${objHead(selectedObjectId, obj, 'i-sun')}
                    ${section('Editor', nameField(obj))}
                    ${section('Lighting', `
                        <div class="field-label">Time of day</div>
                        <div class="tod-row">
                            <input type="range" class="tod" id="prop-tod-range" min="0" max="24" step="0.05" value="${obj.timeOfDay}" aria-label="Time of day">
                            <input type="time" class="time" id="prop-tod" value="${fmtTime(obj.timeOfDay)}" aria-label="Time of day (24 hour clock)">
                        </div>
                        <div class="pill-row">${presets.map(([n, h]) => `<button class="pill" data-tod="${h}" aria-pressed="false">${n}</button>`).join('')}</div>
                    `)}
                    ${section('Simulation', `
                        <div class="field-label">Gravity</div>
                        <div class="tod-row">
                            <input type="range" class="tod" id="prop-grav-range" min="0" max="30" step="0.1" value="${Math.min(30, Number.isFinite(obj.gravity) ? obj.gravity : DEFAULT_GRAVITY)}" aria-label="Gravity">
                            <label class="num grav" title="Gravity in meters per second squared"><input type="number" id="prop-grav" min="0" max="${GRAVITY_MAX}" step="0.1" value="${Number.isFinite(obj.gravity) ? obj.gravity : DEFAULT_GRAVITY}" aria-label="Gravity (m/s²)"><span class="tag">m/s²</span></label>
                        </div>
                        <div class="pill-row">${GRAVITY_PRESETS.map(([n, g]) => `<button class="pill" data-grav="${g}" aria-pressed="false" title="${g} m/s²">${n}</button>`).join('')}</div>
                        <div class="field-label">Kill layer height</div>
                        <label class="num" title="Kill layer height (Y)"><span class="tag y">Y</span><input type="number" id="prop-killy" step="100" value="${Number.isFinite(obj.killY) ? obj.killY : DEFAULT_KILL_Y}" aria-label="Kill layer height"></label>
                        <div class="field-note">Simulated objects that fall below this height are deleted from the world.</div>
                    `)}`;
                const range = document.getElementById('prop-tod-range'), time = document.getElementById('prop-tod');
                range.style.background = 'linear-gradient(to right,' + Array.from({ length: 13 }, (_, i) => { const c = skyAt(i * 2); return rgbStr(mixRGB(c.top, c.hor, 0.5)); }).join(',') + ')';
                const pills = [...container.querySelectorAll('.pill')];
                const sync = () => {
                    pills.forEach(b => b.setAttribute('aria-pressed', String(Math.abs((obj.timeOfDay % 24) - Number(b.dataset.tod)) < 0.01)));
                };
                const setT = (h) => {
                    obj.timeOfDay = Math.max(0, Math.min(24, h));
                    if (document.activeElement !== range) range.value = obj.timeOfDay;
                    if (document.activeElement !== time) time.value = fmtTime(obj.timeOfDay);
                    sync();
                };
                range.addEventListener('input', () => setT(parseFloat(range.value) || 0));
                time.addEventListener('input', () => { const h = parseTime(time.value); if (h !== null) { obj.timeOfDay = h; range.value = h; sync(); } });
                pills.forEach(b => b.addEventListener('click', () => setT(Number(b.dataset.tod))));
                sync();
                const gRange = document.getElementById('prop-grav-range'), gNum = document.getElementById('prop-grav');
                const gPills = [...container.querySelectorAll('[data-grav]')];
                const gSync = () => gPills.forEach(b => b.setAttribute('aria-pressed', String(Math.abs(obj.gravity - Number(b.dataset.grav)) < 0.005)));
                const setG = (g) => {
                    obj.gravity = Math.max(0, Math.min(GRAVITY_MAX, Math.round(g * 100) / 100));
                    if (document.activeElement !== gRange) gRange.value = Math.min(30, obj.gravity);
                    if (document.activeElement !== gNum) gNum.value = obj.gravity;
                    gSync();
                };
                gRange.addEventListener('input', () => setG(parseFloat(gRange.value) || 0));
                gNum.addEventListener('input', () => { const g = parseFloat(gNum.value); if (Number.isFinite(g)) setG(g); });
                gNum.addEventListener('change', () => { const g = parseFloat(gNum.value); setG(Number.isFinite(g) ? g : DEFAULT_GRAVITY); gNum.value = obj.gravity; });
                gPills.forEach(b => b.addEventListener('click', () => setG(Number(b.dataset.grav))));
                gSync();
                const killEl = document.getElementById('prop-killy');
                killEl.addEventListener('input', () => { const v = parseFloat(killEl.value); if (Number.isFinite(v)) obj.killY = v; });
                killEl.addEventListener('change', () => {
                    const v = parseFloat(killEl.value);
                    obj.killY = Number.isFinite(v) ? v : DEFAULT_KILL_Y;
                    killEl.value = obj.killY;
                });
                bindName(obj);
                return;
            }

        // ───────── Sky & time of day ─────────
        const SKY_KEYS = [

        const stars = (() => {
            let seed = 1337;

        let skyBright = true;

        // ───────── Move / Scale handles ─────────

            for (const axis of ['x', 'y', 'z']) {
                for (const sign of [1, -1]) {

                    const pc = project(center);

precision highp float;
uniform vec3 uCam, uR, uU, uF;

layout(location = 0) in vec3 aPos;
layout(location = 1) in vec3 aNormal;
layout(location = 2) in vec2 aUV;

uniform vec3 uCenter, uHalf;

in vec2 vUV;
flat in float vFace;
uniform vec3 uColors[6];
uniform vec3 uEdgeColor;
uniform float uEdgeAlpha, uEdgeW;
uniform int uWire;
out vec4 o;
void main() {

layout(location = 0) in vec3 aP0;
layout(location = 1) in vec3 aP1;
layout(location = 2) in vec2 aSE;
layout(location = 3) in vec4 aCol;
layout(location = 4) in float aW;

        function makeLabelAtlas(color, shadow) {

                    faces.forEach((f, fi) => {

        function drawFallback(prisms) {
            // Axes
            const axisLimit = 5;
            draw3DLine(new Vec3(-axisLimit, 0, 0), new Vec3(axisLimit, 0, 0), skyBright ? 'rgba(239, 68, 68, 0.7)' : 'rgba(239, 68, 68, 0.4)', 2);
            draw3DLine(new Vec3(0, -axisLimit, 0), new Vec3(0, axisLimit, 0), skyBright ? 'rgba(34, 197, 94, 0.7)' : 'rgba(34, 197, 94, 0.4)', 2);
            draw3DLine(new Vec3(0, 0, -axisLimit), new Vec3(0, 0, axisLimit), skyBright ? 'rgba(59, 130, 246, 0.7)' : 'rgba(59, 130, 246, 0.4)', 2);

                    const rot = transformPoint(v), scale = FOV / rot.z;

                });
                for (const face of faces) {
                    if (face.indices.some(i => tv[i].z3d < 0.1)) continue;
                    const n = rotateVector(face.normal);
                    let cx3 = 0, cy3 = 0, cz3 = 0;
                    for (const idx of face.indices) { cx3 += tv[idx].x3d; cy3 += tv[idx].y3d; cz3 += tv[idx].z3d; }
                    cx3 /= 4; cy3 /= 4; cz3 /= 4;
                    if (n.dot(new Vec3(cx3, cy3, cz3)) >= 0) continue;

                    // sunlight / moonlight comes from the sky, so faces light up depending on the time of day
                    const diffuse = Math.max(0, face.normal.dot(sky.lightWorld));
                    const intensity = sky.ambient + (1 - sky.ambient) * diffuse * sky.lightStrength;
                    const shaded = applyLighting(obj.faceColoring ? face.color : '#888888', intensity);
                    const rightT = rotateVector(face.right), upT = rotateVector(face.up);
                    const scaleC = FOV / cz3;
                    const cx2d = cx3 * scaleC + cx, cy2d = cy3 * scaleC + cy;
                    const rx2d = (cx3 + rightT.x) * (FOV / (cz3 + rightT.z)) + cx, ry2d = (cy3 + rightT.y) * (FOV / (cz3 + rightT.z)) + cy;
                    const dx2d = (cx3 - upT.x) * (FOV / (cz3 - upT.z)) + cx, dy2d = (cy3 - upT.y) * (FOV / (cz3 - upT.z)) + cy;
                    visibleFaces.push({
                        id, obj, label: face.label, color: shaded, depth: cz3,
                        pts: face.indices.map(i => ({ x: tv[i].x2d, y: tv[i].y2d })),
                        t: { cx2d, cy2d, vxX: rx2d - cx2d, vxY: ry2d - cy2d, vyX: dx2d - cx2d, vyY: dy2d - cy2d, scaleC }
                    });
                }
            }
            lastFaces = visibleFaces;   // already in draw order: far prisms first

            for (const face of visibleFaces) {
                const obj = face.obj, sel = face.id === selectedObjectId;
                ctx.beginPath(); ctx.moveTo(face.pts[0].x, face.pts[0].y);
                for (let j = 1; j < face.pts.length; j++) ctx.lineTo(face.pts[j].x, face.pts[j].y);
                ctx.closePath();
                ctx.lineJoin = 'round';

                if (obj.wireframe) {
                    ctx.lineWidth = sel ? 3 : (skyBright ? 2 : 1.5);
                    ctx.strokeStyle = sel ? accentCol : (obj.faceColoring ? face.color : (skyBright ? '#0f172a' : '#38bdf8'));
                    ctx.stroke();
                } else {
                    ctx.fillStyle = face.color; ctx.fill();
                    ctx.lineWidth = sel ? 3.5 : 1.5;
                    ctx.strokeStyle = sel ? accentCol : 'rgba(0, 0, 0, 0.5)';
                    ctx.stroke();
                }

                if (obj.showLabels) {
                    const t = face.t;
                    ctx.save();
                    ctx.transform(t.vxX, t.vxY, t.vyX, t.vyY, t.cx2d, t.cy2d);
                    let constantScale = 1.0 / t.scaleC;
                    const minDim = Math.min(obj.length, obj.width, obj.height) * 2;
                    const maxAllowedScale = (minDim * 0.25) / 45.0;
                    if (constantScale > maxAllowedScale) constantScale = maxAllowedScale;
                    ctx.scale(constantScale, constantScale);
                    ctx.fillStyle = skyBright && obj.wireframe ? '#0f172a' : '#ffffff';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = 'bold 45px -apple-system, sans-serif';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; ctx.shadowBlur = 5;
                    ctx.fillText(face.label, 0, 0);
                    ctx.restore();
                }
            }

            return visibleFaces.length;
        }

        function render() {
            if (!width || !height || !Number.isFinite(cx + cy)) { requestAnimationFrame(render); return; }
            const frameStart = performance.now();
            if (simulationRunning) {
                if (!physicsLastTime) physicsLastTime = frameStart;
                let remaining = Math.min(0.05, Math.max(0, (frameStart - physicsLastTime) / 1000));
                physicsLastTime = frameStart;
                while (remaining > 0) {
                    const step = Math.min(PHYSICS_MAX_STEP, remaining);
                    physicsStep(step);
                    remaining -= step;
                }
                syncPropInputs();
            }

            updateTrig();

            // WASD camera movement (locked while dragging a handle)
            const moveSpeed = 0.05;
            if (!manip && !isTyping()) {
                const forwardX = fwdX, forwardY = fwdY, forwardZ = fwdZ;
                const rightX = rgtX, rightY = 0, rightZ = rgtZ;
                if (keyState['w']) { camPosX += forwardX * moveSpeed; camPosY += forwardY * moveSpeed; camPosZ += forwardZ * moveSpeed; }
                if (keyState['s']) { camPosX -= forwardX * moveSpeed; camPosY -= forwardY * moveSpeed; camPosZ -= forwardZ * moveSpeed; }
                if (keyState['a']) { camPosX -= rightX * moveSpeed; camPosY -= rightY * moveSpeed; camPosZ -= rightZ * moveSpeed; }
                if (keyState['d']) { camPosX += rightX * moveSpeed; camPosY += rightY * moveSpeed; camPosZ += rightZ * moveSpeed; }
            }

            updateSky();
            drawSky();
            renderViewfinder();

            ctx.clearRect(0, 0, width, height);
            const prisms = Object.entries(sceneObjects).filter(([, o]) => o.type === 'prism6' && o.parent === 'world');
            const visibleCount = GL ? drawGL(prisms) : drawFallback(prisms);

            // Handles are drawn last so they sit above every shape (only the UI is above them)
            lastHandles = canEditHandles() ? buildHandles(sceneObjects[selectedObjectId]) : [];
            if (hoverKey && !lastHandles.some(h => h.key === hoverKey)) hoverKey = null;
            const ordered = lastHandles.slice().sort((a, b) => b.z - a.z);
            ordered.sort((a, b) => (a.key === hoverKey) - (b.key === hoverKey));
            for (const h of ordered) drawHandle(h);

            const frameEnd = performance.now();
            frameCount++;
            if (frameEnd - lastFpsTime >= 1000) { currentFps = frameCount; frameCount = 0; lastFpsTime = frameEnd; }
            statFps.textContent = currentFps;
            statFps.dataset.state = currentFps >= 55 ? 'good' : currentFps >= 30 ? 'warn' : 'bad';
            statCpu.textContent = (frameEnd - frameStart).toFixed(2) + " ms";
            statMem.textContent = (window.performance && window.performance.memory) ? (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + " MB" : "N/A";
            statVerts.textContent = prisms.length * 8;
            statFaces.textContent = `${visibleCount} / ${prisms.length * 6}`;

            requestAnimationFrame(render);
        }

        // ───────── Pointer interaction ─────────
        function canvasPos(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        function pointInPoly(x, y, pts) {
            let inside = false;
            for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                const a = pts[i], b = pts[j];
                if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
            }
            return inside;
        }
        function pickInstance(x, y) {
            const r = rayDir(x, y), len = Math.hypot(r.x, r.y, r.z) || 1;
            const d = [r.x / len, r.y / len, r.z / len], o = [camPosX, camPosY, camPosZ];
            let best = null, bestT = Infinity;
            for (const [id, p] of Object.entries(sceneObjects)) {
                if (p.type !== 'prism6' || p.parent !== 'world') continue;
                const mn = [p.x - p.width, p.y - p.height, p.z - p.length], mx = [p.x + p.width, p.y + p.height, p.z + p.length];
                let tmin = -Infinity, tmax = Infinity, ok = true;
                for (let k = 0; k < 3; k++) {
                    if (Math.abs(d[k]) < 1e-9) { if (o[k] < mn[k] || o[k] > mx[k]) ok = false; }
                    else {
                        let t1 = (mn[k] - o[k]) / d[k], t2 = (mx[k] - o[k]) / d[k];
                        if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
                        tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
                    }
                }
                if (ok && tmax >= tmin && tmax > 0) { const t = Math.max(tmin, 0); if (t < bestT) { bestT = t; best = id; } }
            }
            return best;
        }

        function startManip(h, m) {
            const o = sceneObjects[selectedObjectId];
            const t0 = axisParam(h.center, h.d, m.x, m.y);
            if (t0 === null) return;
            manip = { h, o, t0, start: { x: o.x, y: o.y, z: o.z, width: o.width, height: o.height, length: o.length } };
            canvas.style.cursor = 'grabbing';
        }
        function updateManip(m) {
            const t = axisParam(manip.h.center, manip.h.d, m.x, m.y);
            if (t === null) return;
            let delta = Math.max(-500, Math.min(500, t - manip.t0));
            const step = settings.gizmoOffset;
            if (step > 0) delta = Math.round(delta / step) * step;
            const { o, start, h } = manip;
            const r2 = (v) => Math.round(v * 10000) / 10000;
            if (h.type === 'move') {
                o[h.axis] = r2(start[h.axis] + h.sign * delta);
            } else {
                const half = HALF_KEY[h.axis];
                const grow = Math.max(delta, -(2 * start[half] - 0.1));   // keep a sliver of size
                o[half] = r2(start[half] + grow / 2);
                o[h.axis] = r2(start[h.axis] + h.sign * grow / 2);
            }
            syncPropInputs();
        }

        // Turn the view in place: left/right = yaw, up/down = pitch (no momentum; free look, horizon always level)
        function look(dx, dy) {
            angleY += dx * LOOK_SENS;
            angleX = clampPitch(angleX - dy * LOOK_SENS);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0 && e.button !== 2) return;
            if (e.button === 2 && !settings.rightClick) return;
            if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
            const m = canvasPos(e);
            if (e.button === 0) {
                const h = findHandleAt(m.x, m.y);
                if (h) { startManip(h, m); if (manip) return; }
            }
            camDrag = {
                button: e.button, sx: e.clientX, sy: e.clientY, px: e.clientX, py: e.clientY, moved: false,
                rotate: e.button === 2 || settings.leftDrag
            };
        });
        canvas.addEventListener('contextmenu', (e) => { if (settings.rightClick) e.preventDefault(); });
        window.addEventListener('mousemove', (e) => {
            const m = canvasPos(e);
            if (manip) { updateManip(m); return; }
            if (camDrag) {
                if (!camDrag.moved && Math.hypot(e.clientX - camDrag.sx, e.clientY - camDrag.sy) > 4) {
                    camDrag.moved = true;
                    camDrag.px = camDrag.sx; camDrag.py = camDrag.sy;
                }
                if (camDrag.moved && camDrag.rotate) {
                    look(e.clientX - camDrag.px, e.clientY - camDrag.py);
                    camDrag.px = e.clientX; camDrag.py = e.clientY;
                }
                return;
            }
            const h = e.target === canvas ? findHandleAt(m.x, m.y) : null;
            hoverKey = h ? h.key : null;
            canvas.style.cursor = h ? 'pointer' : '';
        });
        window.addEventListener('mouseup', (e) => {
            if (manip) { manip = null; canvas.style.cursor = ''; return; }
            if (camDrag && e.button === camDrag.button) {
                if (!camDrag.moved && camDrag.button === 0) {
                    const m = canvasPos(e);
                    const id = pickInstance(m.x, m.y);
                    if (id !== selectedObjectId) selectItem(id);
                }
                camDrag = null;
            }
        });
        canvas.addEventListener('mouseleave', () => { if (!manip) { hoverKey = null; canvas.style.cursor = ''; } });

        // ───────── Boot ─────────
        initGL();
        applySettings();
        refreshTheme();
        renderExplorer();
        renderProperties();
        setMode('select');
        requestAnimationFrame(render);
    </script>
</body>
</html>
